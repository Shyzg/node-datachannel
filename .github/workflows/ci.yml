name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja openssl@3
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies and build native addon
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript output
        run: pnpm run build:ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Verify ESM and CommonJS entrypoints
        run: |
          node -e "import('./dist/lib/index.js').then((m) => { if (typeof m.getLibraryVersion !== 'function') process.exit(1); })"
          node -e "import('./dist/polyfill/index.js').then((m) => { if (typeof m.RTCPeerConnection !== 'function') process.exit(1); })"
          node -e "const m = require('./dist/lib/index.js'); if (typeof m.getLibraryVersion !== 'function') process.exit(1);"
          node -e "const m = require('./dist/polyfill/index.js'); if (typeof m.RTCPeerConnection !== 'function') process.exit(1);"

      - name: Verify npm package tarball
        if: runner.os == 'Linux'
        run: npm pack --dry-run
