name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja openssl@3
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Cache Windows OpenSSL (vcpkg)
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache@v6
        with:
          path: C:\vcpkg\installed\x64-windows-static
          key: vcpkg-openssl-x64-windows-static-v1

      - name: Install Windows OpenSSL (vcpkg)
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          if not exist "C:\vcpkg\vcpkg.exe" call C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install openssl:x64-windows-static

      - name: Install dependencies and build native addon (Linux / macOS)
        if: runner.os != 'Windows'
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native addon (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: >
          pnpm exec cmake-js build
          --CDCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake"
          --CDVCPKG_TARGET_TRIPLET=x64-windows-static
          --CDCMAKE_PREFIX_PATH="C:\vcpkg\installed\x64-windows-static"

      - name: Build TypeScript output
        run: pnpm run build:ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Verify ESM and CommonJS entrypoints
        run: |
          node -e "import('./dist/lib/index.js').then((m) => { if (typeof m.getLibraryVersion !== 'function') process.exit(1); })"
          node -e "import('./dist/polyfill/index.js').then((m) => { if (typeof m.RTCPeerConnection !== 'function') process.exit(1); })"
          node -e "const m = require('./dist/lib/index.js'); if (typeof m.getLibraryVersion !== 'function') process.exit(1);"
          node -e "const m = require('./dist/polyfill/index.js'); if (typeof m.RTCPeerConnection !== 'function') process.exit(1);"

      - name: Verify npm package tarball
        if: runner.os == 'Linux'
        run: npm pack --dry-run

      - name: Verify minimal build (NO_MEDIA=1, NO_WEBSOCKET=1)
        if: runner.os == 'Linux'
        run: |
          pnpm exec cmake-js configure --CDNO_MEDIA=1 --CDNO_WEBSOCKET=1
          pnpm exec cmake-js build
          node -e "
            import('./dist/lib/index.js').then((m) => {
              if (m.Video !== undefined || m.Audio !== undefined || m.Track !== undefined || m.WebSocket !== undefined) {
                throw new Error('Expected media and WebSocket exports to be undefined in minimal build');
              }
              let wsThrew = false;
              try { new m.WebSocketServer(); } catch (err) { wsThrew = /WebSocket support is disabled/.test(err.message); }
              if (!wsThrew) throw new Error('Expected WebSocketServer to throw when WebSocket support is disabled');
              const pc = new m.PeerConnection('MinimalPeer', { iceServers: [] });
              const dc = pc.createDataChannel('dc');
              dc.close();
              pc.close();
              m.cleanup();
            });
          "
